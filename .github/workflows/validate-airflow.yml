
name: Validate Airflow DAG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dag:
    runs-on: ubuntu-24.04

    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Apache Airflow with constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install "apache-airflow==3.3.2" \
            --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"

      - name: Import DAG and validate task dependencies
        run: |
          python - <<'PY'
          from airflow.models import DagBag

          dag_bag = DagBag(
              dag_folder="dags",
          )

          assert not dag_bag.import_errors, (
              f"DAG import errors: {dag_bag.import_errors}"
          )

          dag = dag_bag.dags.get("opendataflow_pipeline")
          assert dag is not None, "DAG was not discovered"

          expected_tasks = {
              "check_database_empty_task",
              "initialize_database_task",
              "clean_and_validate_data_task",
              "load_cleaned_data_task",
              "validate_database_task",
          }

          actual_tasks = set(dag.task_ids)
          assert actual_tasks == expected_tasks, (
              f"Unexpected task IDs: {actual_tasks}"
          )

          expected_upstream = {
              "validate_database_task": {
                  "clean_and_validate_data_task",
                  "load_cleaned_data_task",
              },
          }

          for task_id, upstream_ids in expected_upstream.items():
              actual_upstream = dag.get_task(
                  task_id
              ).upstream_task_ids

              assert actual_upstream == upstream_ids, (
                  f"{task_id}: expected {upstream_ids}, "
                  f"got {actual_upstream}"
              )

          print("DAG import succeeded.")
          print(f"DAG ID: {dag.dag_id}")
          print(f"Task count: {len(dag.tasks)}")
          print("Final task dependencies verified.")
          PY
